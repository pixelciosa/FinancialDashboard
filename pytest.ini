[pytest]
testpaths = tests
addopts = -q -m "not live and not e2e" --strict-markers -p no:cacheprovider
markers =
    live: usa red real (yfinance, CoinGecko, Gemma). Correr a mano con: pytest -m live
    e2e: navegador headless (requiere playwright). Correr con: pytest -m e2e
# Un xfail que empieza a pasar es una señal: el bug se arregló y hay que quitar la marca.
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
