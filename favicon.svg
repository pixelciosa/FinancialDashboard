<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- SOLID DARK MATTE CONTAINER (No glass, no blur, crisp rounded square) -->
  <rect width="92" height="92" x="4" y="4" rx="20" fill="#0b0f19" stroke="#1e2638" stroke-width="2"/>

  <!-- GEOMETRIC WEALTH RING (Flat vector accent ring) -->
  <circle cx="50" cy="48" r="32" fill="none" stroke="#10d9a0" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="50" cy="48" r="22" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- PATRIMONIAL TREE OF WEALTH & GROWTH (Vector Geometry) -->
  
  <!-- ROOT & TRUNK (Solid Gold Geometry) -->
  <!-- Base Anchor Root -->
  <polygon points="42,80 58,80 54,68 46,68" fill="#d97706"/>
  <!-- Main Trunk -->
  <polygon points="46,70 54,70 52,48 48,48" fill="#f59e0b"/>
  <!-- Trunk Inner Highlight Facet -->
  <polygon points="49,70 54,70 52,48 49,48" fill="#fbbf24"/>

  <!-- LEFT BRANCH -->
  <polygon points="48,54 32,42 35,39 50,49" fill="#f59e0b"/>
  <polygon points="48,54 32,42 33,40 49,51" fill="#d97706"/>

  <!-- RIGHT BRANCH -->
  <polygon points="52,54 68,42 65,39 50,49" fill="#f59e0b"/>
  <polygon points="52,54 68,42 67,40 51,51" fill="#fbbf24"/>

  <!-- CENTER SPIRE -->
  <polygon points="49,48 50,30 51,48" fill="#fbbf24"/>

  <!-- NODE CONNECTOR TREND LINES -->
  <path d="M 28 42 L 38 28 L 50 18 L 62 28 L 72 42" fill="none" stroke="#10d9a0" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- GEOMETRIC LEAF CANOPY NODES (Solid Flat Vector Circles & Accents) -->

  <!-- Bottom Left Leaf Node -->
  <circle cx="28" cy="42" r="7.5" fill="#059669"/>
  <circle cx="28" cy="42" r="5.5" fill="#10d9a0"/>
  <circle cx="28" cy="42" r="2" fill="#ffffff"/>

  <!-- Bottom Right Leaf Node -->
  <circle cx="72" cy="42" r="7.5" fill="#059669"/>
  <circle cx="72" cy="42" r="5.5" fill="#10d9a0"/>
  <circle cx="72" cy="42" r="2" fill="#ffffff"/>

  <!-- Mid Left Leaf Node (Gold Heritage Node) -->
  <circle cx="38" cy="28" r="8" fill="#d97706"/>
  <circle cx="38" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="38" cy="28" r="2.5" fill="#fef08a"/>

  <!-- Mid Right Leaf Node (Fresh Emerald Node) -->
  <circle cx="62" cy="28" r="8" fill="#059669"/>
  <circle cx="62" cy="28" r="6" fill="#10d9a0"/>
  <circle cx="62" cy="28" r="2.5" fill="#ffffff"/>

  <!-- TOP CROWN LEAF NODE (Apex Heritage Peak) -->
  <circle cx="50" cy="18" r="9.5" fill="#059669"/>
  <circle cx="50" cy="18" r="7.5" fill="#10d9a0"/>
  <circle cx="50" cy="18" r="4.5" fill="#fbbf24"/>
  <circle cx="50" cy="18" r="2" fill="#ffffff"/>
</svg>
